name: One-time migrate GitHub secrets to AWS

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate-secrets:
    # Do not run this migration for fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          # Staging SM target (077953579693)
          aws-access-key-id: ${{ secrets.MIGRATE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MIGRATE_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.MIGRATE_AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Migrate repository secrets
        shell: bash
        env:
          JIRACLOUD_PROJECT_KEY: ${{ secrets.JIRACLOUD_PROJECT_KEY }}
          JIRASERVER_BASE_URL: ${{ secrets.JIRASERVER_BASE_URL }}
          JIRASERVER_PASSWORD: ${{ secrets.JIRASERVER_PASSWORD }}
          JIRASERVER_PROJECT_KEY: ${{ secrets.JIRASERVER_PROJECT_KEY }}
          JIRASERVER_USERNAME: ${{ secrets.JIRASERVER_USERNAME }}
          XRAYCLOUD_CLIENT_ID: ${{ secrets.XRAYCLOUD_CLIENT_ID }}
          XRAYCLOUD_CLIENT_SECRET: ${{ secrets.XRAYCLOUD_CLIENT_SECRET }}
          XRAYCLOUD_TEST_PLAN_KEY: ${{ secrets.XRAYCLOUD_TEST_PLAN_KEY }}
          XRAYSERVER_TEST_PLAN_KEY: ${{ secrets.XRAYSERVER_TEST_PLAN_KEY }}

          # Sheet-style path: <repo>/actions/<SECRET_NAME>
          AWS_SECRET_PREFIX: tutorial-js-k6/actions

        run: |
          set -euo pipefail

          umask 077

          required_vars=(
            JIRACLOUD_PROJECT_KEY
            JIRASERVER_BASE_URL
            JIRASERVER_PASSWORD
            JIRASERVER_PROJECT_KEY
            JIRASERVER_USERNAME
            XRAYCLOUD_CLIENT_ID
            XRAYCLOUD_CLIENT_SECRET
            XRAYCLOUD_TEST_PLAN_KEY
            XRAYSERVER_TEST_PLAN_KEY
          )

          for var in "${required_vars[@]}"; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Required GitHub secret '$var' is missing or empty."
              exit 1
            fi
          done

          upsert_secret() {
            local name="$1"
            local value="$2"
            local secret_id="${AWS_SECRET_PREFIX}/${name}"
            local secret_file
            local put_err

            secret_file="$(mktemp)"
            printf '%s' "$value" > "$secret_file"

            echo "Migrating: $secret_id"

            aws secretsmanager restore-secret \
              --secret-id "$secret_id" \
              >/dev/null 2>&1 || true

            put_err="$(mktemp)"
            if aws secretsmanager put-secret-value \
                --secret-id "$secret_id" \
                --secret-string "file://$secret_file" \
                >/dev/null 2>"$put_err"; then
              echo "Updated existing: $secret_id"
            elif grep -q 'ResourceNotFoundException' "$put_err"; then
              aws secretsmanager create-secret \
                --name "$secret_id" \
                --secret-string "file://$secret_file" \
                >/dev/null
              echo "Created new: $secret_id"
            else
              echo "::error::Failed to upsert $secret_id"
              cat "$put_err" >&2
              rm -f "$secret_file" "$put_err"
              return 1
            fi

            rm -f "$secret_file" "$put_err"
          }

          echo "Migrating repository secrets to AWS Secrets Manager..."
          echo "Prefix: $AWS_SECRET_PREFIX"

          for var in "${required_vars[@]}"; do
            upsert_secret "$var" "${!var}"
          done

          echo "Migration completed."
